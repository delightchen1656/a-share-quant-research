<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>沪深主板 · K线与结构信号</title><link rel="stylesheet" href="/styles.css"><script src="/app.js" defer></script></head>
<body><header class="top"><div class="brand"><b>K</b><div><strong>沪深主板</strong><span>K线与结构信号</span></div></div><nav class="market-tabs" aria-label="市场分页"><a href="/">沪深主板</a><a href="/gold">伦敦金 · USD</a><a href="/sse">上证 · 牛熊</a></nav><span class="mode">日K · 本地行情</span><div id="snapshot">正在读取快照…</div></header>
<main><aside><div class="aside-title"><strong id="list-title">股票列表</strong><span id="stock-count"></span></div><label class="direction-picker">查看范围<select id="direction" aria-label="选择方向"><option value="raw">原K线</option><option value="d1">方向1 · 超跌反弹 v3</option></select></label><label class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索代码 / 股票名称" aria-label="搜索股票代码或名称" autocomplete="off"></label><div class="scope"><button id="scope-all" class="active">全量主板</button><button id="scope-leaders">★ 龙头标记</button></div><div id="signal-controls" hidden><label>排序<select id="sort" aria-label="信号排序"><option value="time_desc">时间：新到旧</option><option value="time_asc">时间：旧到新</option><option value="up_desc">最大涨幅：高到低</option><option value="up_asc">最大涨幅：低到高</option><option value="down_asc">最大跌幅：跌得多在前</option><option value="down_desc">最大跌幅：跌得少在前</option><option value="count_desc">同股信号次数：多到少</option></select></label><div class="signal-dates"><input type="date" id="from-date" aria-label="信号开始日期"><span>至</span><input type="date" id="to-date" aria-label="信号结束日期"></div><small id="signal-note"></small></div><div class="list-head"><span id="list-label">名称 / 代码</span><span id="filtered-count"></span></div><div id="stock-list" role="listbox" aria-label="沪深主板股票与信号列表"></div><footer>↑ ↓ 切换 · 仅沪深主板</footer></aside>
<section class="workspace"><div class="stock-heading"><div><div class="stock-name"><h1 id="name">正在加载</h1><span id="code"></span><span class="basis">前复权</span></div><div id="subtitle">日线全历史 · 仅展示有成交的交易日</div></div><div class="navigation"><button id="previous">↑ 上一只</button><button id="next">下一只 ↓</button></div></div>
<div class="quote" id="quote" aria-live="off"><strong>—</strong></div>
<div id="signal-detail" hidden></div>
<div class="chart-card"><div class="toolbar"><div class="ranges"><button data-range="63">近3个月</button><button data-range="250" class="active">近一年</button><button data-range="all">全部K线</button></div><div class="chart-controls"><label class="date-jump"><input type="date" id="jump-date" aria-label="定位日期"><button id="jump">定位</button></label><button id="zoom-in" aria-label="放大K线">＋</button><button id="zoom-out" aria-label="缩小K线">−</button><button id="recent">最新</button></div></div>
<div class="legend"><label class="ma5"><input type="checkbox" data-ma="5" checked>MA5 <span id="ma5">—</span></label><label class="ma10"><input type="checkbox" data-ma="10" checked>MA10 <span id="ma10">—</span></label><label class="ma20"><input type="checkbox" data-ma="20" checked>MA20 <span id="ma20">—</span></label><label class="ma60"><input type="checkbox" data-ma="60" checked>MA60 <span id="ma60">—</span></label><span>滚轮缩放 · 拖动平移 · 悬停看价</span></div>
<div class="chart-wrap" id="chart-wrap"><canvas id="chart" tabindex="0" aria-label="日K线与成交量图，仅显示有成交的交易日"></canvas><div id="status" role="status">正在读取日线…</div></div>
<div class="timeline"><span id="date-range">—</span><input type="range" id="pan" min="0" max="0" value="0" aria-label="平移K线窗口"><span id="visible-count"></span></div></div>
<div class="bottom-note"><span id="coverage"></span><span title="星标来自保留的合并龙头名单快照，并非历史当时归属">★ 仅为名单快照标记</span></div></section></main></body></html>
