<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08111f"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2308111f'/%3E%3Cpath d='M14 42h9V26h9v16h9V18h9v24' fill='none' stroke='%234de1c1' stroke-width='6'/%3E%3C/svg%3E"><title>沪深主板数据中心</title><link rel="stylesheet" href="styles.css"></head><body><main>
<header><div><span class="eyebrow">A-SHARE DATA OPS</span><h1>沪深主板数据中心</h1></div><div class="status-pill" id="state"><i></i><span>读取中</span></div></header>
<section class="hero panel"><div class="hero-copy"><p class="label">总下载进度</p><div class="metric"><strong id="percent">0.00%</strong><span id="fraction">0 / 0 项</span></div><div class="progress"><div id="progressBar"></div></div><p class="muted" id="range">数据范围 2018-01-01 至今</p></div><div class="actions"><button class="primary" id="startBtn">▶ 继续断点下载</button><button class="secondary" id="stopBtn">Ⅱ 安全暂停</button></div></section>
<section class="grid stats"><article class="panel stat"><span>当前股票</span><strong id="current">—</strong><small id="kind">等待任务</small></article><article class="panel stat"><span>本次速度</span><strong id="speed">—</strong><small>项 / 小时</small></article><article class="panel stat"><span>预计剩余</span><strong id="eta">—</strong><small>按当前速度</small></article><article class="panel stat"><span>失败</span><strong id="failures">0</strong><small>可再次续跑</small></article></section>
<section class="grid lower"><article class="panel exchange-card"><div class="section-title"><div><span class="eyebrow">BREAKDOWN</span><h2>市场明细</h2></div><span>每股两份数据</span></div><div class="exchange-row"><b>上海主板</b><div><span id="shRaw">0</span> 原始价</div><div><span id="shQfq">0</span> 前复权</div><em id="shStocks">0 只</em></div><div class="exchange-row"><b>深圳主板</b><div><span id="szRaw">0</span> 原始价</div><div><span id="szQfq">0</span> 前复权</div><em id="szStocks">0 只</em></div></article>
<article class="panel chat-card"><div class="section-title"><div><span class="eyebrow">NATURAL CONTROL</span><h2>直接告诉我</h2></div></div><div id="chat" class="chat"><div class="bubble bot">你可以说：“继续下载”、“暂停”、“下载到多少了”或“只下载深市”。</div></div><form id="chatForm"><input id="chatInput" autocomplete="off" placeholder="输入一句话控制下载…"><button>发送</button></form></article></section>
<section class="panel recent-card"><div class="section-title"><div><span class="eyebrow">RECENT FILES</span><h2>最近完成</h2></div><span id="updated">—</span></div><div id="recent" class="recent"></div></section>
</main><script src="app.js"></script></body></html>
